services:

  # ---------------------------------------------------------------------------
  # app : conteneur PHP-FPM 8.4 — point d'entrée de l'application Symfony
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      # Bind mount pour le rechargement à chaud du code en développement
      - .:/var/www/html
      # Named volumes : sortent var/cache et var/log du bind mount Windows (~600× plus lent
      # que le FS natif du conteneur sur les stat()). Indispensable sous Docker Desktop WSL2.
      # Reset propre via : docker compose down -v
      - symfony_cache:/var/www/html/var/cache
      - symfony_log:/var/www/html/var/log
      # Bind mount du php.ini : les modifications prennent effet avec un simple restart (sans rebuild)
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
    env_file:
      - .env
      - path: .env.local
        required: false
    networks:
      - creapret-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"echo 'OK';\" | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # nginx : serveur web -- sert l'application HTTP. Port conteneur : 80.
  # Port hote : la valeur par defaut de l'interpolation (${...:-<defaut>} plus bas)
  # est portable. Pour la surcharger sur une machine donnee, definir le port dans
  # docker-compose.override.yml (non versionne, charge automatiquement par Compose).
  # ATTENTION : ${VAR} est interpole par Compose SUR L'HOTE, qui ne lit que .env,
  # jamais .env.local. .env.local n'est lu que par Symfony et par env_file, donc
  # uniquement DANS le conteneur -- y definir un port hote n'a aucun effet.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      # Accès au répertoire public/ pour servir les assets statiques
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - creapret-net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # phpmyadmin : interface web MySQL (dev uniquement). Port conteneur : 80.
  # Port hote : la valeur par defaut de l'interpolation (${...:-<defaut>} plus bas)
  # est portable. Pour la surcharger sur une machine donnee, definir le port dans
  # docker-compose.override.yml (non versionne, charge automatiquement par Compose).
  # ATTENTION : ${VAR} est interpole par Compose SUR L'HOTE, qui ne lit que .env,
  # jamais .env.local. .env.local n'est lu que par Symfony et par env_file, donc
  # uniquement DANS le conteneur -- y definir un port hote n'a aucun effet.
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-creapret}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-creapret}
    networks:
      - creapret-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # db : MySQL 8 — persistance des données via volume nommé
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    # log-bin-trust-function-creators : autorise la creation de triggers/procedures
    # par un user non-SUPER quand le binary logging est actif (US-12.1).
    command: --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts d'initialisation joues UNE SEULE FOIS, sur un volume VIERGE
      # (comportement de l'image MySQL). Garantit qu'un nouveau clone obtient
      # d'emblee la base de test et ses privileges. Sur un volume deja initialise,
      # ce montage est sans effet : utiliser scripts/init-test-db.sh.
      - ./docker/mysql/init-dev.d:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-creapret}
      MYSQL_USER: ${MYSQL_USER:-creapret}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-creapret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    networks:
      - creapret-net
    healthcheck:
      # $$ (double dollar) : echappe l'interpolation Compose sur l'hote -- la variable
      # est resolue par le shell DANS le conteneur, ou MYSQL_ROOT_PASSWORD est defini.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Volumes nommés — les données MySQL survivent aux arrêts/redémarrages
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  symfony_cache:
    driver: local
  symfony_log:
    driver: local

# ------------------------------------------------------------------------------
# Réseau interne — les services communiquent par leur nom de service (app, db)
# ------------------------------------------------------------------------------
networks:
  creapret-net:
    driver: bridge
