security:
    # argon2id impose sur tous les environnements (CLAUDE.md §5). Cout de test abaisse
    # dans config/packages/test/security.yaml (time_cost 3 = plancher Sodium).
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: argon2id

    # Provider d'entite : consomme a l'authentification (US-1.3 form_login).
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_utilisateur_provider

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

# Cout de hachage de test : voir config/packages/test/security.yaml (source unique,
# argon2id time_cost 3 = plancher Sodium, cible App\Entity\Utilisateur).
