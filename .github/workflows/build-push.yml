name: Build & Push image

# Construit l'image de production et la publie sur GHCR. Appelable par d'autres
# workflows (workflow_call) ou manuellement (workflow_dispatch).
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: "Image taguee poussee sur GHCR"
        value: ${{ jobs.build-push.outputs.image }}

# Concurrence : une construction par reference ; annule les builds redondants (idempotents).
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # ghcr.io/sgahovey/creapret (derive du depot -> portable).
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Authentification au registre par le jeton fourni automatiquement par GitHub.
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag = empreinte du commit : c'est ce SHA que deploy-ci.sh attend et valide.
      - name: Calculer le tag image
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build & push (cible runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
